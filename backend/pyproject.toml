[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocki"
version = "0.1.0"
description = "Stocki data pipeline: Postgres-backed, scikit-learn-style datasets for intraday stock direction prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
stocki = "stocki.cli:main"

[tool.setuptools.packages.find]
include = ["stocki*"]

[tool.setuptools.package-data]
stocki = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: test requires a live Postgres (skipped when unreachable)",
]
filterwarnings = ["error::DeprecationWarning:stocki.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends()/Query() in argument defaults is how FastAPI declares dependencies.
"stocki/api/*.py" = ["B008"]
"stocki/api/routes/*.py" = ["B008"]
